<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Множественный JOIN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
  .card { background: #fff; border-radius: 16px; border: 1px solid #e5e4de; padding: 2rem; width: 100%; max-width: 800px; }

  /* ── Hint ── */
  .hint { font-size: 13px; color: #5f5e5a; line-height: 1.65; margin-bottom: 14px; min-height: 38px; transition: opacity .2s; }
  .hint b { color: #2c2c2a; }
  .tag { display:inline-block; border-radius:5px; padding:1px 7px; font-size:11px; font-weight:600; }
  .tag-blue   { background:#E6F1FB; color:#0C447C; }
  .tag-green  { background:#EAF3DE; color:#27500A; }
  .tag-yellow { background:#FAEEDA; color:#633806; }
  .tag-purple { background:#F0EAF8; color:#5B2D8E; }

  /* ── Source tables row ── */
  .sources { display: flex; gap: 0; margin-bottom: 18px; align-items: stretch; position: relative; }
  .src-block { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .join-arrow { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 4px; padding-top: 22px; }
  .join-pill { font-size: 10px; font-weight: 700; letter-spacing: .3px; border-radius: 20px; padding: 3px 8px; border: 1px solid transparent; transition: all .3s; white-space: nowrap; }
  .join-pill.inactive { background: #f5f5f3; color: #c5c3ba; border-color: #e5e4de; }
  .join-pill.active-inner  { background: #E6F1FB; color: #0C447C; border-color: #85B7EB; }
  .join-pill.active-left   { background: #F0EAF8; color: #5B2D8E; border-color: #C9A8E8; }
  .arrow-line { width: 1px; background: #e5e4de; flex: 1; transition: background .3s; }
  .arrow-line.active { background: #85B7EB; }
  .arrow-tip { font-size: 14px; color: #c5c3ba; transition: color .3s; }
  .arrow-tip.active { color: #85B7EB; }

  .tbl-label { font-size: 11px; font-weight: 600; color: #888780; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; text-align: center; }
  .tbl-wrap { border-radius: 8px; overflow: hidden; border: 1.5px solid #e5e4de; transition: border-color .3s, box-shadow .3s; width: 100%; }
  .tbl-wrap.active-table  { border-color: #85B7EB; box-shadow: 0 0 0 3px #E6F1FB; }
  .tbl-wrap.joining-table { border-color: #C9A8E8; box-shadow: 0 0 0 3px #F0EAF8; }
  .tbl-wrap.done-table    { border-color: #b5d88a; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 6px 9px; font-size: 10px; color: #888780; font-weight: 500; border-bottom: 1px solid #e5e4de; background: #fafaf8; }
  td { padding: 6px 9px; border-bottom: 1px solid #f0efe8; color: #2c2c2a; transition: background .25s; }
  td:last-child { border-bottom: none; }

  tr.row-active td   { background: #EAF3DE; color: #27500A; font-weight: 500; }
  tr.row-joining td  { background: #F0EAF8; color: #5B2D8E; }
  tr.row-null td     { background: #FAEEDA; color: #633806; font-style: italic; }
  tr.row-dim td      { opacity: .2; }

  /* ── SQL box ── */
  .sql-box { font-family: 'Courier New', monospace; font-size: 12.5px; line-height: 2; padding: 14px 16px; background: #1e1e2e; border-radius: 10px; margin-bottom: 16px; white-space: pre; overflow-x: auto; color: #cdd6f4; }
  .kw    { color: #89b4fa; }
  .jkw   { color: #cba6f7; }
  .jkw2  { color: #a6e3a1; }
  .val   { color: #a6e3a1; }
  .dim-line { opacity: .25; }
  .new-line { animation: fadeIn .35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  /* ── Steps ── */
  .steps { display: flex; gap: 0; margin-bottom: 16px; border-radius: 10px; overflow: hidden; border: 1px solid #e5e4de; }
  .step-btn { flex: 1; padding: 9px 4px; font-size: 12px; border: none; background: #fafaf8; color: #888780; cursor: pointer; transition: all .15s; border-right: 1px solid #e5e4de; line-height: 1.3; }
  .step-btn:last-child { border-right: none; }
  .step-btn:hover { background: #f0efe8; }
  .step-btn.active { background: #E6F1FB; color: #0C447C; font-weight: 600; }
  .step-num { display: block; font-size: 10px; color: #b4b2a9; font-weight: 400; margin-bottom: 2px; }
  .step-btn.active .step-num { color: #5a9fd4; }

  /* ── Result ── */
  .result-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .result-label { font-size: 11px; font-weight: 600; color: #888780; text-transform: uppercase; letter-spacing: .5px; }
  .result-count { font-size: 12px; color: #b4b2a9; }
  .result-table-wrap { border-radius: 8px; overflow: hidden; border: 1.5px solid #e5e4de; }

  td.null-val { color: #c9a86f; font-style: italic; opacity: .7; }

  /* ── Nav buttons ── */
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .nav-btn { padding: 8px 20px; border-radius: 8px; border: 1px solid #d3d1c7; background: transparent; color: #2c2c2a; font-size: 13px; cursor: pointer; transition: all .15s; }
  .nav-btn:hover:not(:disabled) { background: #f5f5f3; }
  .nav-btn:disabled { opacity: .3; cursor: default; }
  .nav-btn.primary { background: #0C447C; color: #fff; border-color: #0C447C; }
  .nav-btn.primary:hover:not(:disabled) { background: #0a3a6a; }
  .step-indicator { font-size: 13px; color: #888780; }
</style>
</head>
<body>
<div class="card">

  <!-- Step tabs -->
  <div class="steps" id="steps-row"></div>

  <!-- Hint -->
  <div class="hint" id="hint"></div>

  <!-- SQL -->
  <div class="sql-box" id="sql"></div>

  <!-- Source tables -->
  <div class="sources" id="sources"></div>

  <!-- Result -->
  <div class="result-header">
    <div class="result-label">Результат</div>
    <div class="result-count" id="res-count"></div>
  </div>
  <div class="result-table-wrap">
    <table id="result-table">
      <thead id="result-head"></thead>
      <tbody id="result-body"></tbody>
    </table>
  </div>

  <!-- Nav -->
  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="go(-1)">← Назад</button>
    <span class="step-indicator" id="step-ind"></span>
    <button class="nav-btn primary" id="btn-next" onclick="go(1)">Вперёд →</button>
  </div>

</div>
<script>
// ─── Data ───────────────────────────────────────────
const t1 = [
  {id:1, name:'Игорь'},
  {id:2, name:'Денис'},
  {id:3, name:'Иван'},
  {id:4, name:'Ольга'},
];
const t2 = [
  {id:1, profession:'Аналитик'},
  {id:2, profession:'Дворник'},
  {id:3, profession:'Диджей'},
  {id:4, profession:'Менеджер'},
];
const t3 = [
  {id:1, vacation_days:14},
  {id:3, vacation_days:7},
  // Денис и Ольга не ходили в отпуск
];

// ─── Steps config ────────────────────────────────────
const steps = [
  {
    label: 'FROM table1',
    shortLabel: 'Стартовая\nтаблица',
    hint: '<b>Шаг 1:</b> Начинаем с <span class="tag tag-blue">table1</span> — это основа запроса. Все остальные таблицы будут присоединяться к ней по очереди.',
    activeT: [0], joiningT: [],
    cols: ['user_id','name'],
    rows: t1.map(r => ({cells:[r.id, r.name], state:'active'})),
    joinedSoFar: 1,
  },
  {
    label: 'INNER JOIN table2',
    shortLabel: 'INNER JOIN\ntable2',
    hint: '<b>Шаг 2:</b> Присоединяем <span class="tag tag-purple">table2</span> через <span class="tag tag-blue">INNER JOIN</span>. Берём текущий результат и находим для каждой строки пару по <b>user_id</b>. Так как все ID совпадают — ни одна строка не теряется.',
    activeT: [0], joiningT: [1],
    cols: ['user_id','name','profession'],
    rows: t1.map(r => {
      const p = t2.find(x => x.id === r.id);
      return {cells:[r.id, r.name, p ? p.profession : null], state:'active'};
    }),
    joinedSoFar: 2,
  },
  {
    label: 'LEFT JOIN table3',
    shortLabel: 'LEFT JOIN\ntable3',
    hint: '<b>Шаг 3:</b> Присоединяем <span class="tag tag-purple">table3</span> через <span class="tag tag-green">LEFT JOIN</span>. Оставляем все строки из текущего результата. Денис и Ольга не ходили в отпуск — их нет в table3, поэтому <b>vacation_days = NULL</b>.',
    activeT: [0,1], joiningT: [2],
    cols: ['user_id','name','profession','vacation_days'],
    rows: t1.map(r => {
      const p = t2.find(x => x.id === r.id);
      const v = t3.find(x => x.id === r.id);
      return {
        cells:[r.id, r.name, p ? p.profession : null, v ? v.vacation_days : null],
        state: v ? 'active' : 'null'
      };
    }),
    joinedSoFar: 3,
  },
];

// ─── Source table definitions ─────────────────────────
const srcTables = [
  { label:'table1', sublabel:'имена', cols:['user_id','name'],         rows: t1.map(r=>[r.id, r.name]) },
  { label:'table2', sublabel:'профессии', cols:['user_id','profession'], rows: t2.map(r=>[r.id, r.profession]) },
  { label:'table3', sublabel:'отпуск', cols:['user_id','vacation_days'], rows: [
    [1,14],[3,7],
    ['—','—'],['—','—'],  // placeholder rows so table doesn't collapse
  ], special:[false,false,true,true] },
];
// for table3 show only real rows
srcTables[2].rows = [[1,14],[3,7]];
srcTables[2].special = [false, false];

let cur = 0;

// ─── SQL lines ───────────────────────────────────────
function getSql(step) {
  const kw = (s,cls='kw') => `<span class="${cls}">${s}</span>`;
  const lines = [
    `${kw('SELECT')} t1.user_id, t1.name, t2.profession, t3.vacation_days`,
    `${kw('FROM')}   dict.aaa_company_user_name ${kw('AS')} t1`,
  ];
  const joins = [
    `${kw('INNER JOIN','jkw')} dict.aaa_company_user_profession ${kw('AS')} t2`,
    `         ${kw('ON')} t1.user_id = t2.user_id`,
    `${kw('LEFT JOIN','jkw2')}  dict.aaa_company_user_vacation ${kw('AS')} t3`,
    `         ${kw('ON')} t2.user_id = t3.user_id`,
  ];
  const totalJoinLines = joins.length; // 4
  // step 0 → 0 join lines, step 1 → 2, step 2 → 4
  const activeJoinLines = step === 0 ? 0 : step === 1 ? 2 : 4;
  const html = lines.join('\n') + '\n' +
    joins.map((l, i) => {
      if (i < activeJoinLines) return `<span class="new-line">${l}</span>`;
      return `<span class="dim-line">${l}</span>`;
    }).join('\n');
  return html;
}

// ─── Render ──────────────────────────────────────────
function render() {
  const s = steps[cur];

  // step tabs
  const stepsRow = document.getElementById('steps-row');
  stepsRow.innerHTML = steps.map((st, i) => `
    <button class="step-btn ${i===cur?'active':''}" onclick="goTo(${i})">
      <span class="step-num">Шаг ${i+1}</span>
      ${st.label}
    </button>`).join('');

  // hint
  document.getElementById('hint').innerHTML = s.hint;

  // SQL
  document.getElementById('sql').innerHTML = getSql(cur);

  // Source tables
  const sourcesEl = document.getElementById('sources');
  sourcesEl.innerHTML = '';
  srcTables.forEach((st, ti) => {
    const isActive  = s.activeT.includes(ti);
    const isJoining = s.joiningT.includes(ti);
    const isDone    = ti < (cur === 0 ? 1 : cur);
    const wrapCls   = isJoining ? 'tbl-wrap joining-table'
                    : isActive  ? 'tbl-wrap active-table'
                    : ti < s.joinedSoFar ? 'tbl-wrap done-table'
                    : 'tbl-wrap';

    // Determine row states based on current step and which table this is
    let rowStates = st.rows.map(() => '');
    if (ti === 0) {
      // t1 rows: matched = green always; if step 2 and null = yellow for missing vacation
      rowStates = st.rows.map((r, ri) => {
        if (cur === 0) return 'row-active';
        if (cur === 1) return 'row-active';
        const v = t3.find(x => x.id === t1[ri].id);
        return v ? 'row-active' : 'row-null';
      });
    } else if (ti === 1) {
      rowStates = st.rows.map(() => cur >= 1 ? 'row-joining' : 'row-dim');
    } else if (ti === 2) {
      // t3 has only 2 rows (Игорь, Иван)
      rowStates = st.rows.map(() => cur >= 2 ? 'row-joining' : 'row-dim');
    }

    const block = document.createElement('div');
    block.className = 'src-block';
    block.innerHTML = `
      <div class="tbl-label">${st.label} <span style="font-size:10px;font-weight:400;color:#b4b2a9">(${st.sublabel})</span></div>
      <div class="${wrapCls}">
        <table>
          <thead><tr>${st.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${st.rows.map((r,ri)=>`
            <tr class="${rowStates[ri]}">${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    sourcesEl.appendChild(block);

    // Arrow between tables
    if (ti < srcTables.length - 1) {
      const jLabel = ti === 0 ? 'INNER JOIN' : 'LEFT JOIN';
      const jActive = ti === 0 ? cur >= 1 : cur >= 2;
      const arrowEl = document.createElement('div');
      arrowEl.className = 'join-arrow';
      arrowEl.innerHTML = `
        <div class="join-pill ${jActive ? (ti===0?'active-inner':'active-left') : 'inactive'}">${jLabel}</div>
        <div class="arrow-line ${jActive?'active':''}"></div>
        <div class="arrow-tip ${jActive?'active':''}">→</div>`;
      sourcesEl.appendChild(arrowEl);
    }
  });

  // Result table
  const rHead = document.getElementById('result-head');
  const rBody = document.getElementById('result-body');
  const rCount = document.getElementById('res-count');
  rHead.innerHTML = `<tr>${s.cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  rBody.innerHTML = s.rows.map(r => {
    const cls = r.state === 'null' ? 'row-null' : 'row-active';
    return `<tr class="${cls}">${r.cells.map(v =>
      v === null ? `<td class="null-val">NULL</td>` : `<td>${v}</td>`
    ).join('')}</tr>`;
  }).join('');
  rCount.textContent = `${s.rows.length} строк`;

  // Nav
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === steps.length - 1;
  document.getElementById('btn-next').textContent = cur === steps.length - 1 ? 'Готово ✓' : 'Вперёд →';
  document.getElementById('step-ind').textContent = `${cur+1} / ${steps.length}`;
}

function go(dir) { goTo(cur + dir); }
function goTo(i) {
  if (i < 0 || i >= steps.length) return;
  cur = i;
  render();
}

render();
</script>
</body>
</html>
