<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETWEEN и диапазоны</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 18px;
    background: #f5f5f3;
    color: #2c2c2a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding: 26px;
    border: 1px solid #e5e4de;
    border-radius: 16px;
    background: #fff;
  }
  h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.02em; }
  .intro { margin: 0 0 18px; color: #686762; font-size: 14px; line-height: 1.6; }
  .intro code, .note code { color: #185fa5; font-family: "Courier New", monospace; font-weight: 700; }
  .controls {
    display: grid;
    grid-template-columns: .8fr .85fr 1.5fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .control {
    min-width: 0;
    padding: 13px;
    border: 1px solid #e5e4de;
    border-radius: 10px;
    background: #fafaf8;
  }
  .control-title { margin-bottom: 9px; color: #85837c; font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
  select, input[type="date"] {
    width: 100%;
    padding: 8px 9px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: #fff;
    color: #373734;
    font: 12px "Courier New", monospace;
  }
  .mode-buttons { display: flex; gap: 6px; }
  .mode-button {
    flex: 1;
    padding: 7px 8px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: #fff;
    color: #5f5e5a;
    font: 700 11px "Courier New", monospace;
    cursor: pointer;
  }
  .mode-button.active { border-color: #85b7eb; background: #e6f1fb; color: #0c447c; }
  .bounds { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  .bound-label { display: flex; min-width: 0; flex-direction: column; gap: 5px; color: #888780; font-size: 10px; }
  .and-label { padding-top: 17px; color: #185fa5; font: 700 11px "Courier New", monospace; }
  input[type="range"] { width: 100%; accent-color: #185fa5; }
  .range-value { color: #0c447c; font: 700 12px "Courier New", monospace; }
  .numberline {
    position: relative;
    height: 76px;
    margin: 4px 0 14px;
    border: 1px solid #e5e4de;
    border-radius: 10px;
    background: #fafaf8;
  }
  .axis { position: absolute; top: 38px; left: 6%; right: 6%; height: 2px; background: #d9d7d0; }
  .range-segment { position: absolute; top: 31px; height: 16px; border-radius: 8px; background: #b5d88a; border: 1px solid #639922; transition: left .2s, width .2s; }
  .range-segment.outside-left, .range-segment.outside-right { background: #f5c2c2; border-color: #d56b6b; }
  .point { position: absolute; top: 25px; width: 2px; height: 28px; background: #185fa5; transform: translateX(-50%); }
  .point span { position: absolute; top: -19px; left: 50%; color: #0c447c; font: 700 11px "Courier New", monospace; transform: translateX(-50%); white-space: nowrap; }
  .axis-label { position: absolute; top: 54px; color: #999790; font: 10px "Courier New", monospace; transform: translateX(-50%); }
  .hint {
    margin-bottom: 14px;
    padding: 10px 12px;
    border-left: 3px solid #85b7eb;
    border-radius: 7px;
    background: #f3f8fd;
    color: #315c84;
    font-size: 13px;
    line-height: 1.55;
  }
  .sql {
    margin-bottom: 18px;
    padding: 15px 17px;
    overflow-x: auto;
    border-radius: 11px;
    background: #1e1e2e;
    color: #cdd6f4;
    font: 13px/1.75 "Courier New", monospace;
    white-space: pre;
  }
  .kw { color: #89b4fa; font-weight: 700; }
  .column { color: #cba6f7; }
  .value { color: #a6e3a1; }
  .equivalent { margin-top: 3px; color: #7f849c; font-size: 11px; }
  .tables { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
  .table-title { display: flex; justify-content: space-between; margin-bottom: 7px; color: #77756f; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .count { color: #999790; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .table-wrap { overflow-x: auto; border: 1px solid #e5e4de; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px 9px; border-bottom: 1px solid #efeee9; text-align: left; white-space: nowrap; }
  th { background: #fafaf8; color: #77756f; font: 11px "Courier New", monospace; }
  tr:last-child td { border-bottom: 0; }
  .source-row.match td { background: #eaf3de; color: #27500a; }
  .source-row.match td:first-child { border-left: 3px solid #639922; padding-left: 6px; }
  .source-row.filtered td { opacity: .22; }
  .tested { background: #edf5fc !important; font-weight: 700; }
  .boundary { box-shadow: inset 0 0 0 2px #85b7eb; }
  .empty { padding: 34px 12px; color: #999790; font-size: 12px; text-align: center; }
  .note { margin: 14px 0 0; color: #77756f; font-size: 12px; line-height: 1.55; }
  .note b { color: #343431; }
  @media (max-width: 720px) {
    body { padding: 12px; }
    .card { padding: 18px; }
    .controls, .tables { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="card">
  <h1>BETWEEN и диапазоны</h1>
  <p class="intro"><code>BETWEEN</code> проверяет, находится ли значение между нижней и верхней границей. Обе границы включены в диапазон.</p>

  <div class="controls">
    <section class="control">
      <div class="control-title">1. Столбец</div>
      <select id="field-select">
        <option value="price">price</option>
        <option value="views">views</option>
        <option value="published_date">published_date</option>
      </select>
    </section>
    <section class="control">
      <div class="control-title">2. Режим</div>
      <div class="mode-buttons">
        <button class="mode-button active" type="button" data-mode="between">BETWEEN</button>
        <button class="mode-button" type="button" data-mode="not-between">NOT BETWEEN</button>
      </div>
    </section>
    <section class="control">
      <div class="control-title">3. Границы</div>
      <div id="bounds" class="bounds"></div>
    </section>
  </div>

  <div id="numberline" class="numberline"></div>
  <div id="hint" class="hint"></div>
  <div id="sql" class="sql"></div>

  <div class="tables">
    <section>
      <div class="table-title"><span>Исходная таблица</span><span class="count">границы выделены рамкой</span></div>
      <div class="table-wrap"><table><thead id="source-head"></thead><tbody id="source-body"></tbody></table></div>
    </section>
    <section>
      <div class="table-title"><span>После WHERE</span><span id="result-count" class="count"></span></div>
      <div id="result-wrap" class="table-wrap"></div>
    </section>
  </div>

  <p class="note"><b>Эквивалентная запись:</b> <code>BETWEEN a AND b</code> означает <code>&gt;= a AND &lt;= b</code>.</p>
</main>

<script>
const rows = [
  { item_id: 101, price: 3200, views: 74, published_date: '2026-08-02' },
  { item_id: 102, price: 8500, views: 91, published_date: '2026-08-05' },
  { item_id: 103, price: 12500, views: 156, published_date: '2026-08-08' },
  { item_id: 104, price: 17900, views: 203, published_date: '2026-08-12' },
  { item_id: 105, price: 24000, views: 318, published_date: '2026-08-16' },
  { item_id: 106, price: 31000, views: 412, published_date: '2026-08-21' },
];

const fields = {
  price: { type: 'number', lower: 8500, upper: 24000, min: 0, max: 35000, step: 500 },
  views: { type: 'number', lower: 100, upper: 320, min: 0, max: 450, step: 10 },
  published_date: { type: 'date', lower: '2026-08-05', upper: '2026-08-16', min: '2026-08-01', max: '2026-08-24' },
};

const columns = ['item_id', 'price', 'views', 'published_date'];
let field = 'price';
let mode = 'between';

const format = (value) => typeof value === 'number' ? value.toLocaleString('ru-RU') : value;
const config = () => fields[field];
const inRange = (value) => value >= config().lower && value <= config().upper;
const matches = (row) => mode === 'between' ? inRange(row[field]) : !inRange(row[field]);
const isBoundary = (value) => value === config().lower || value === config().upper;

function sqlLiteral(value) {
  return config().type === 'date' ? `DATE '${value}'` : String(value);
}

function renderBounds() {
  const c = config();
  const inputType = c.type === 'date' ? 'date' : 'range';
  const attributes = c.type === 'date'
    ? `min="${c.min}" max="${c.max}"`
    : `min="${c.min}" max="${c.max}" step="${c.step}"`;

  document.getElementById('bounds').innerHTML = `
    <label class="bound-label">от
      <input id="lower-bound" type="${inputType}" ${attributes} value="${c.lower}">
      ${c.type === 'number' ? `<span id="lower-label" class="range-value">${format(c.lower)}</span>` : ''}
    </label>
    <span class="and-label">AND</span>
    <label class="bound-label">до
      <input id="upper-bound" type="${inputType}" ${attributes} value="${c.upper}">
      ${c.type === 'number' ? `<span id="upper-label" class="range-value">${format(c.upper)}</span>` : ''}
    </label>`;

  document.getElementById('lower-bound').addEventListener('input', (event) => updateBound('lower', event.target.value));
  document.getElementById('upper-bound').addEventListener('input', (event) => updateBound('upper', event.target.value));
}

function updateBound(side, rawValue) {
  const c = config();
  const value = c.type === 'number' ? Number(rawValue) : rawValue;
  c[side] = value;

  if (side === 'lower' && c.lower > c.upper) {
    c.upper = c.lower;
    document.getElementById('upper-bound').value = c.upper;
  }
  if (side === 'upper' && c.upper < c.lower) {
    c.lower = c.upper;
    document.getElementById('lower-bound').value = c.lower;
  }

  const lowerLabel = document.getElementById('lower-label');
  const upperLabel = document.getElementById('upper-label');
  if (lowerLabel) lowerLabel.textContent = format(c.lower);
  if (upperLabel) upperLabel.textContent = format(c.upper);
  renderDynamic();
}

function position(value) {
  const c = config();
  if (c.type === 'date') {
    const min = new Date(c.min).getTime();
    const max = new Date(c.max).getTime();
    return 6 + (new Date(value).getTime() - min) / (max - min) * 88;
  }
  return 6 + (value - c.min) / (c.max - c.min) * 88;
}

function renderNumberline() {
  const c = config();
  const left = position(c.lower);
  const right = position(c.upper);
  const middleClass = mode === 'between' ? '' : 'outside-left';
  let segments = `<div class="range-segment ${middleClass}" style="left:${left}%;width:${Math.max(0, right - left)}%"></div>`;
  if (mode === 'not-between') {
    segments = `<div class="range-segment" style="left:6%;width:${Math.max(0, left - 6)}%"></div>
      <div class="range-segment outside-left" style="left:${left}%;width:${Math.max(0, right - left)}%"></div>
      <div class="range-segment" style="left:${right}%;width:${Math.max(0, 94 - right)}%"></div>`;
  }
  document.getElementById('numberline').innerHTML = `<div class="axis"></div>${segments}
    <div class="point" style="left:${left}%"><span>${format(c.lower)}</span></div>
    <div class="point" style="left:${right}%"><span>${format(c.upper)}</span></div>
    <span class="axis-label" style="left:6%">${format(c.min)}</span>
    <span class="axis-label" style="left:94%">${format(c.max)}</span>`;
}

function renderSql() {
  const not = mode === 'not-between' ? '<span class="kw">NOT</span> ' : '';
  const lower = sqlLiteral(config().lower);
  const upper = sqlLiteral(config().upper);
  const equivalent = mode === 'between'
    ? `${field} &gt;= ${lower} AND ${field} &lt;= ${upper}`
    : `${field} &lt; ${lower} OR ${field} &gt; ${upper}`;
  document.getElementById('sql').innerHTML = `<span class="kw">SELECT</span> item_id, price, views, published_date\n<span class="kw">FROM</span>   listings\n<span class="kw">WHERE</span>  <span class="column">${field}</span> ${not}<span class="kw">BETWEEN</span> <span class="value">${lower}</span> <span class="kw">AND</span> <span class="value">${upper}</span>\n<span class="equivalent">-- то же самое: ${equivalent}</span>`;
}

function renderTables() {
  const result = rows.filter(matches);
  document.getElementById('result-count').textContent = `${result.length} из ${rows.length} строк`;
  document.getElementById('source-head').innerHTML = `<tr>${columns.map((column) => `<th class="${column === field ? 'tested' : ''}">${column}</th>`).join('')}</tr>`;
  document.getElementById('source-body').innerHTML = rows.map((row) => `<tr class="source-row ${matches(row) ? 'match' : 'filtered'}">${columns.map((column) => {
    const classes = [column === field ? 'tested' : '', column === field && isBoundary(row[column]) ? 'boundary' : ''].filter(Boolean).join(' ');
    return `<td class="${classes}">${format(row[column])}</td>`;
  }).join('')}</tr>`).join('');

  document.getElementById('result-wrap').innerHTML = result.length === 0
    ? '<div class="empty">В выбранный диапазон не попала ни одна строка</div>'
    : `<table><thead><tr>${columns.map((column) => `<th>${column}</th>`).join('')}</tr></thead><tbody>${result.map((row) => `<tr>${columns.map((column) => `<td>${format(row[column])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

function renderHint() {
  const c = config();
  const action = mode === 'between' ? 'внутри диапазона' : 'за пределами диапазона';
  document.getElementById('hint').innerHTML = `Остаются строки, где <b>${field}</b> находится ${action}. Значения, равные <b>${sqlLiteral(c.lower)}</b> и <b>${sqlLiteral(c.upper)}</b>, ${mode === 'between' ? 'тоже проходят фильтр' : 'не проходят NOT BETWEEN'}.`;
}

function renderDynamic() {
  renderNumberline();
  renderSql();
  renderTables();
  renderHint();
}

function render() {
  renderBounds();
  renderDynamic();
}

document.getElementById('field-select').addEventListener('change', (event) => {
  field = event.target.value;
  render();
});

document.querySelector('.mode-buttons').addEventListener('click', (event) => {
  const button = event.target.closest('[data-mode]');
  if (!button) return;
  mode = button.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach((item) => item.classList.toggle('active', item.dataset.mode === mode));
  renderDynamic();
});

render();
</script>
</body>
</html>
