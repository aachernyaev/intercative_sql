<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL операторы — AND / OR / IN / NULL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
  .card { background: #fff; border-radius: 16px; border: 1px solid #e5e4de; padding: 2rem; width: 100%; max-width: 680px; height: fit-content; }

  .op-btn { padding: 7px 20px; border-radius: 8px; border: 1px solid #d3d1c7; background: transparent; color: #2c2c2a; font-size: 14px; cursor: pointer; transition: all .15s; }
  .op-btn:hover { background: #f5f5f3; }
  .op-btn.active { background: #E6F1FB; color: #0C447C; border-color: #85B7EB; font-weight: 500; }
  .op-btn.active-warn { background: #FAEEDA; color: #633806; border-color: #EF9F27; font-weight: 500; }

  .hint { font-size: 13px; color: #5f5e5a; padding: 8px 0 14px; line-height: 1.6; }
  .hint b { color: #2c2c2a; font-weight: 500; }
  .hint .warn { display:inline-block; background:#FAEEDA; color:#633806; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:500; margin-top:6px; }

  .sql-box { font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.8; padding: 14px 16px; background: #f5f5f3; border-radius: 10px; margin-bottom: 1rem; white-space: pre; border: 1px solid #e5e4de; color: #2c2c2a; }
  .kw { color: #185FA5; }
  .val { color: #3B6D11; }
  .strike { text-decoration: line-through; opacity: .5; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; border: 1px solid #d3d1c7; cursor: pointer; font-size: 13px; color: #5f5e5a; transition: all .15s; user-select: none; background: #fff; }
  .chip:hover { border-color: #b4b2a9; background: #f5f5f3; }
  .chip.on { border-color: #85B7EB; background: #E6F1FB; color: #0C447C; }
  .chip.on-warn { border-color: #EF9F27; background: #FAEEDA; color: #633806; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d3d1c7; flex-shrink: 0; transition: background .15s; }
  .chip.on .dot { background: #185FA5; }
  .chip.on-warn .dot { background: #854F0B; }

  .count { font-size: 12px; color: #888780; margin-bottom: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; font-size: 12px; color: #888780; font-weight: 400; border-bottom: 1px solid #e5e4de; }
  td { padding: 8px 12px; border-bottom: 1px solid #f0efe8; color: #2c2c2a; transition: all .2s; }
  tr.match td { background: #EAF3DE; color: #27500A; font-weight: 500; }
  tr.match td:first-child { border-left: 3px solid #639922; padding-left: 9px; }
  tr.dimmed td { opacity: .2; }
  tr.null-row td { font-style: italic; color: #888780; }
  tr.null-row.match td { background: #FAEEDA; color: #633806; font-style: italic; }
  tr.null-row.match td:first-child { border-left: 3px solid #EF9F27; padding-left: 9px; }
  .null-badge { font-size: 11px; background: #f0efe8; color: #888780; border-radius: 4px; padding: 1px 6px; font-style: normal; margin-left: 4px; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap">
    <button class="op-btn active" id="btn-and" onclick="setMode('AND')">AND</button>
    <button class="op-btn" id="btn-or" onclick="setMode('OR')">OR</button>
    <button class="op-btn" id="btn-in" onclick="setMode('IN')">IN</button>
    <button class="op-btn" id="btn-null" onclick="setMode('NULL')">NULL</button>
    <button class="op-btn" id="btn-parens" onclick="setMode('PARENS')">(OR) AND</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="sql-box" id="sql"></div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <table>
    <thead><tr><th>Город</th><th>Регион</th><th>Средняя зарплата</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const rows = [
  {city:'Москва',           region:'Москва',             sal:95000,  isNull:false},
  {city:'Зеленоград',       region:'Москва',             sal:82000,  isNull:false},
  {city:'Новая Москва',     region:'Москва',             sal:78000,  isNull:false},
  {city:'Анадырь',          region:'Чукотский АО',       sal:86153,  isNull:false},
  {city:'Певек',            region:'Чукотский АО',       sal:86153,  isNull:false},
  {city:'Краснодар',        region:'Краснодарский край', sal:55000,  isNull:false},
  {city:'Сочи',             region:'Краснодарский край', sal:62000,  isNull:false},
  {city:'Город не указан',  region:null,                 sal:60000,  isNull:true},
  {city:'Населённый пункт', region:null,                 sal:45000,  isNull:true},
  {city:'Местоположение ?', region:null,                 sal:71000,  isNull:true},
];

const allReg = ['Москва','Чукотский АО','Краснодарский край'];
const nullSubModes = ['!=', 'IS NULL', 'IS NOT NULL'];

let mode = 'AND', cA = true, cB = true;
let inSet = new Set(['Москва','Чукотский АО']);
let nullSub = '!=';
let withParens = false;

const hints = {
  AND: 'Строка попадает в результат, только если <b>оба</b> условия выполняются одновременно. Кликни по условию, чтобы включить или выключить его.',
  OR:  'Строка попадает в результат, если выполняется <b>хотя бы одно</b> из условий. Сравни количество строк с режимом AND.',
  IN:  'Короткая замена множеству OR — проверяет, входит ли значение в список. Добавляй и убирай регионы из списка.',
  NULL:'NULL — это отсутствие значения. Обычный оператор != не находит строки с NULL — для них нужен <b>IS NULL</b> или <b>IS NOT NULL</b>.<br><span class="warn">Частая ошибка: WHERE region != \'Москва\' пропустит строки с NULL!</span>',
  PARENS_OFF: '<b>AND выполняется раньше OR</b> — это приоритет операторов. Запрос читается как: все города Москвы ИЛИ (Чукотский АО с зарплатой > 85 000). Фильтр по зарплате к Москве не применяется!<br><span class="warn">Включи скобки и посмотри, как изменится результат.</span>',
  PARENS_ON:  'Скобки <b>меняют порядок выполнения</b>: сначала объединяем оба региона, потом применяем фильтр по зарплате к обоим. Результат другой — хотя условия те же самые.'
};

function fmt(n) { return n.toLocaleString('ru-RU') + ' ₽'; }

function isMatch(r) {
  if (mode === 'AND') {
    if (r.isNull) return false;
    return (cA ? r.region === 'Москва' : true) && (cB ? r.sal > 80000 : true);
  }
  if (mode === 'OR') {
    if (r.isNull) return false;
    if (!cA && !cB) return false;
    return (cA && r.region === 'Москва') || (cB && r.sal > 80000);
  }
  if (mode === 'IN') {
    if (r.isNull) return false;
    return inSet.has(r.region);
  }
  if (mode === 'NULL') {
    if (nullSub === '!=')         return !r.isNull && r.region !== 'Москва';
    if (nullSub === 'IS NULL')    return r.isNull;
    if (nullSub === 'IS NOT NULL')return !r.isNull;
  }
  if (mode === 'PARENS') {
    if (r.isNull) return false;
    if (!withParens) return r.region === 'Москва' || (r.region === 'Чукотский АО' && r.sal > 85000);
    return (r.region === 'Москва' || r.region === 'Чукотский АО') && r.sal > 85000;
  }
}

function getSql() {
  const kw  = s => `<span class="kw">${s}</span>`;
  const val = s => `<span class="val">${s}</span>`;
  const st  = s => `<span class="strike">${s}</span>`;

  if (mode === 'AND') {
    let p = [];
    if (cA) p.push(`region = ${val("'Москва'")}`);
    if (cB) p.push(`avg_salary > ${val('80000')}`);
    const w = p.length ? p.join(`\n       ${kw('AND')} `) : `<span style="opacity:.4">-- выбери условие</span>`;
    return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  ${w}`;
  }
  if (mode === 'OR') {
    let p = [];
    if (cA) p.push(`region = ${val("'Москва'")}`);
    if (cB) p.push(`avg_salary > ${val('80000')}`);
    const w = p.length ? p.join(`\n        ${kw('OR')} `) : `<span style="opacity:.4">-- выбери условие</span>`;
    return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  ${w}`;
  }
  if (mode === 'IN') {
    const list = [...inSet].map(r => val(`'${r}'`)).join(', ') || `<span style="opacity:.4">пусто</span>`;
    return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  region ${kw('IN')} (${list})`;
  }
  if (mode === 'NULL') {
    if (nullSub === '!=')
      return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  region ${kw('!=')} ${val("'Москва'")}\n\n${st('-- строки с NULL сюда не попадут!')}`;
    if (nullSub === 'IS NULL')
      return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  region ${kw('IS NULL')}`;
    if (nullSub === 'IS NOT NULL')
      return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  region ${kw('IS NOT NULL')}`;
  }
  if (mode === 'PARENS') {
    if (!withParens)
      return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  region = ${val("'Москва'")}\n        ${kw('OR')} region = ${val("'Чукотский АО'")}\n       ${kw('AND')} avg_salary > ${val('85000')}\n\n${st('-- AND выполнится раньше OR!')}`;
    return `${kw('SELECT')} city, region, avg_salary\n${kw('FROM')}   my_table\n${kw('WHERE')}  ${kw('(')}region = ${val("'Москва'")}\n        ${kw('OR')} region = ${val("'Чукотский АО'")}${kw(')')}\n       ${kw('AND')} avg_salary > ${val('85000')}`;
  }
}

function render() {
  document.getElementById('hint').innerHTML = mode === 'PARENS'
    ? hints[withParens ? 'PARENS_ON' : 'PARENS_OFF']
    : hints[mode];
  document.getElementById('sql').innerHTML = getSql();

  const ch = document.getElementById('chips');
  ch.innerHTML = '';

  if (mode === 'AND' || mode === 'OR') {
    [{lbl:`region = 'Москва'`, get:()=>cA, tog:()=>{cA=!cA;render();}},
     {lbl:`avg_salary > 80 000`, get:()=>cB, tog:()=>{cB=!cB;render();}}]
    .forEach(c => {
      const d = document.createElement('div');
      d.className = 'chip' + (c.get() ? ' on' : '');
      d.innerHTML = `<span class="dot"></span>${c.lbl}`;
      d.onclick = c.tog;
      ch.appendChild(d);
    });
  } else if (mode === 'IN') {
    allReg.forEach(reg => {
      const d = document.createElement('div');
      d.className = 'chip' + (inSet.has(reg) ? ' on' : '');
      d.innerHTML = `<span class="dot"></span>'${reg}'`;
      d.onclick = () => { inSet.has(reg) ? inSet.delete(reg) : inSet.add(reg); render(); };
      ch.appendChild(d);
    });
  } else if (mode === 'NULL') {
    nullSubModes.forEach(sub => {
      const d = document.createElement('div');
      const isOn = nullSub === sub;
      d.className = 'chip' + (isOn ? (sub === '!=' ? ' on-warn' : ' on') : '');
      d.innerHTML = `<span class="dot"></span>${sub === '!=' ? "region != 'Москва'" : 'region ' + sub}`;
      d.onclick = () => { nullSub = sub; render(); };
      ch.appendChild(d);
    });
  } else if (mode === 'PARENS') {
    const d = document.createElement('div');
    d.className = 'chip' + (withParens ? ' on' : ' on-warn');
    d.innerHTML = `<span class="dot"></span>${withParens ? 'скобки включены' : 'скобки выключены — кликни, чтобы добавить'}`;
    d.onclick = () => { withParens = !withParens; render(); };
    ch.appendChild(d);
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let cnt = 0;
  rows.forEach(r => {
    const m = isMatch(r);
    if (m) cnt++;
    const tr = document.createElement('tr');
    const nullCls = r.isNull ? ' null-row' : '';
    tr.className = (m ? 'match' : 'dimmed') + nullCls;
    const regionCell = r.isNull
      ? `<span style="opacity:.5">—</span><span class="null-badge">NULL</span>`
      : r.region;
    tr.innerHTML = `<td>${r.city}</td><td>${regionCell}</td><td>${fmt(r.sal)}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('count').textContent = `Подходит: ${cnt} из ${rows.length} строк`;
}

function setMode(m) {
  mode = m;
  ['AND','OR','IN','NULL','PARENS'].forEach(x => {
    const btn = document.getElementById('btn-' + x.toLowerCase());
    const isActive = x === m;
    btn.className = 'op-btn' + (isActive ? (m === 'NULL' ? ' active-warn' : (m === 'PARENS' ? ' active-warn' : ' active')) : '');
  });
  if (m === 'PARENS') withParens = false;
  render();
}

render();
</script>
</body>
</html>
